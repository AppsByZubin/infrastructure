apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reporter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/AppsByZubin/infrastructure.git
    targetRevision: main
    path: helm/reporter
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: botspace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
