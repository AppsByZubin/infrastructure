image:
  repository: docker.io/bizzkpm/reporter
  tag: "sha-5d6345c"
  pullPolicy: IfNotPresent

# Run every day at 10 PM IST. Kubernetes 1.27+ supports timeZone on CronJobs.
schedule: "0 22 * * *"
timeZone: "Asia/Kolkata"
suspend: false
concurrencyPolicy: Forbid
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
backoffLimit: 1
ttlSecondsAfterFinished: null
restartPolicy: Never
workingDir: /app

command:
  - python
  - reporter.py

args:
  - --sendmail

env:
  TZ: Asia/Kolkata
  PYTHONUNBUFFERED: "1"
  REPORTER_LOG_DIR: /app/output/logs
  SMTP_TIMEOUT_SECONDS: "30"

secret:
  # Create this Secret out-of-band, or set create=true and provide values below
  # through a safe secret-management flow such as SOPS, SealedSecrets, or ExternalSecrets.
  name: reporter-secrets
  create: false
  stringData:
    DO_S3_REGION: ""
    DO_S3_ACCESS_KEY_ID: ""
    DO_S3_SECRET_ACCESS_KEY: ""
    DO_S3_BUCKET_NAME: ""
    DO_S3_ENDPOINT_URL: ""
    EMAIL_TO: ""
    EMAIL_FROM: ""
    GMAIL_APP_PASSWORD: ""

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# Enable this only if you want reports/logs to survive after the CronJob pod is gone.
# The app emails reports by default, so persistent storage is usually unnecessary.
pvc:
  enabled: false
  claimName: reporter-data
  size: 1Gi
  mountPath: /app/output

imagePullSecrets: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
