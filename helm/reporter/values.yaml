image:
  repository: docker.io/bizzkpm/reporter
  tag: "sha-8ac7149"
  pullPolicy: IfNotPresent

# Run every day at 8:17 PM IST. Kubernetes 1.27+ supports timeZone on CronJobs.
schedule: "40 15 * * *"
timeZone: "Asia/Kolkata"
suspend: false
concurrencyPolicy: Forbid
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
backoffLimit: 1
ttlSecondsAfterFinished: null
restartPolicy: Never
workingDir: /app

command:
  - python
  - reporter.py

args:
  - --slack

env:
  TZ: Asia/Kolkata
  PYTHONUNBUFFERED: "1"
  REPORTER_LOG_DIR: /app/output/logs
  REPORTER_BOT_TIMEOUT_SECONDS: "120"
  SLACK_REPORT_UPLOAD_STRICT: "true"
  SLACK_REPORT_THREAD_TS: "parent-message-ts"
  SLACK_REPORT_INITIAL_COMMENT: "Production cumulative report"
  UPSTOX_API_BASE_URL: https://api.upstox.com
  UPSTOX_ORDER_DETAILS_PATH: /v2/order/details
  UPSTOX_API_TIMEOUT_SECONDS: "30"
  UPSTOX_API_ACCESS_TOKEN: "eyJ0eXAiOiJKV1QiLCJrZXlfaWQiOiJza192MS4wIiwiYWxnIjoiSFMyNTYifQ.eyJzdWIiOiI3QkFYVDYiLCJqdGkiOiI2YTU4NDEzYzZiMmVlYTQ0YWYyODQzYzYiLCJpc011bHRpQ2xpZW50IjpmYWxzZSwiaXNQbHVzUGxhbiI6dHJ1ZSwiaWF0IjoxNzg0MTY4NzY0LCJpc3MiOiJ1ZGFwaS1nYXRld2F5LXNlcnZpY2UiLCJleHAiOjE3ODQyMzkyMDB9.9IYdFRl8Fhj3MEqIGHgPLClcNcn-qf9fT39xZ33uMbg"
  DO_S3_REGION: "sgp1"
  DO_S3_ACCESS_KEY_ID: "DO00HTRKUMPEG449UQQF"
  DO_S3_SECRET_ACCESS_KEY: "ylqc648Tf6pIyx+VAGQYYqfLJk6ck7sD8Z4tdZPjRk0"
  DO_S3_BUCKET_NAME: "index-bucket"
  DO_S3_ENDPOINT_URL: "https://sgp1.digitaloceanspaces.com"
  EMAIL_TO: ""
  EMAIL_FROM: ""
  GMAIL_APP_PASSWORD: ""

slackSecret:
  name: reporter-slack-secrets
  create: false
  stringData:
    SLACK_BOT_TOKEN: ""
    SLACK_CHANNEL_ID: ""

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# Enable this only if you want reports/logs to survive after the CronJob pod is gone.
# The app uploads reports to Slack by default, so persistent storage is usually unnecessary.
pvc:
  enabled: false
  claimName: reporter-data
  size: 1Gi
  mountPath: /app/output

imagePullSecrets: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
