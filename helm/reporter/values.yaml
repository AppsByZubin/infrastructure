image:
  repository: docker.io/bizzkpm/reporter
  tag: "sha-8e57e7e"
  pullPolicy: IfNotPresent

# Run every day at 3:45 PM IST. Kubernetes 1.27+ supports timeZone on CronJobs.
schedule: "45 15 * * *"
timeZone: "Asia/Kolkata"
suspend: false
concurrencyPolicy: Forbid
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
backoffLimit: 1
ttlSecondsAfterFinished: null
restartPolicy: Never
workingDir: /app

command:
  - python
  - reporter.py

args:
  - --slack

env:
  TZ: Asia/Kolkata
  PYTHONUNBUFFERED: "1"
  REPORTER_LOG_DIR: /app/output/logs
  REPORTER_BOT_TIMEOUT_SECONDS: "120"
  SLACK_REPORT_UPLOAD_STRICT: "true"
  SLACK_REPORT_INITIAL_COMMENT: "Production cumulative report"
  UPSTOX_API_BASE_URL: https://api.upstox.com
  UPSTOX_ORDER_DETAILS_PATH: /v2/order/details
  UPSTOX_API_TIMEOUT_SECONDS: "30"

secret:
  # Create this Secret out-of-band, or set create=true and provide values below
  # through a safe secret-management flow such as SOPS, SealedSecrets, or ExternalSecrets.
  name: reporter-secrets
  create: false
  stringData:
    DO_S3_REGION: ""
    DO_S3_ACCESS_KEY_ID: ""
    DO_S3_SECRET_ACCESS_KEY: ""
    DO_S3_BUCKET_NAME: ""
    DO_S3_ENDPOINT_URL: ""
    SLACK_BOT_TOKEN: ""
    SLACK_CHANNEL_ID: ""
    UPSTOX_API_ACCESS_TOKEN: ""
    EMAIL_TO: ""
    EMAIL_FROM: ""
    GMAIL_APP_PASSWORD: ""

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# Enable this only if you want reports/logs to survive after the CronJob pod is gone.
# The app uploads reports to Slack by default, so persistent storage is usually unnecessary.
pvc:
  enabled: false
  claimName: reporter-data
  size: 1Gi
  mountPath: /app/output

imagePullSecrets: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
