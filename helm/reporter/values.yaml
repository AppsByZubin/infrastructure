image:
  repository: docker.io/bizzkpm/reporter
  tag: "sha-b86774e"
  pullPolicy: IfNotPresent

# Run every day at 8:17 PM IST. Kubernetes 1.27+ supports timeZone on CronJobs.
schedule: "35 15 * * *"
timeZone: "Asia/Kolkata"
suspend: false
concurrencyPolicy: Forbid
successfulJobsHistoryLimit: 3
failedJobsHistoryLimit: 3
backoffLimit: 1
ttlSecondsAfterFinished: null
restartPolicy: Never
workingDir: /app

command:
  - python
  - reporter.py

args:
  - --slack

env:
  TZ: Asia/Kolkata
  PYTHONUNBUFFERED: "1"
  REPORTER_LOG_DIR: /app/output/logs
  REPORTER_BOT_TIMEOUT_SECONDS: "120"
  SLACK_REPORT_UPLOAD_STRICT: "true"
  SLACK_REPORT_THREAD_TS: "parent-message-ts"
  SLACK_REPORT_INITIAL_COMMENT: "Production cumulative report"
  UPSTOX_API_BASE_URL: https://api.upstox.com
  UPSTOX_ORDER_DETAILS_PATH: /v2/order/details
  UPSTOX_API_TIMEOUT_SECONDS: "30"
  UPSTOX_API_ACCESS_TOKEN: "eyJ0eXAiOiJKV1QiLCJrZXlfaWQiOiJza192MS4wIiwiYWxnIjoiSFMyNTYifQ.eyJzdWIiOiI3QkFYVDYiLCJqdGkiOiI2YWM0NTlmYTc3YjdjMTI5OTk5MDQwZmQiLCJpc011bHRpQ2xpZW50IjpmYWxzZSwiaXNQbHVzUGxhbiI6dHJ1ZSwiaWF0IjoxNzkxMjUyOTg2LCJpc3MiOiJ1ZGFwaS1nYXRld2F5LXNlcnZpY2UiLCJleHAiOjE3OTEzMjQwMDB9.DKhgi0wtVarmugNtmltNwZQci9GyHf_HB4EbzpFVmwE"
  # CloudPE endpoint for the same bucket the bots write to. Non-secret, so it
  # belongs here; the two credentials come from s3Secret below.
  CLOUDPE_S3_ENDPOINT_URL: "https://s3.in-west2.purestore.io"
  CLOUDPE_S3_REGION: "in-west2"
  CLOUDPE_S3_BUCKET_NAME: "index-bucket"
  EMAIL_TO: ""
  EMAIL_FROM: ""
  GMAIL_APP_PASSWORD: ""

# CloudPE S3 credentials. The Secret is created out of band by
# botyard/scripts/add_cloudpe_s3_secrets.sh so the keys never land in git.
# It must exist before the CronJob runs and contain CLOUDPE_S3_ACCESS_KEY_ID
# and CLOUDPE_S3_SECRET_ACCESS_KEY.
# Reporter reads the bot artifacts that carry the order ids, so it has to point
# at the same bucket the bots write to.
s3Secret:
  enabled: true
  name: reporter-s3-secrets

slackSecret:
  name: reporter-slack-secrets
  create: false
  stringData:
    SLACK_BOT_TOKEN: ""
    SLACK_CHANNEL_ID: ""

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "500m"
    memory: "512Mi"

# Enable this only if you want reports/logs to survive after the CronJob pod is gone.
# The app uploads reports to Slack by default, so persistent storage is usually unnecessary.
pvc:
  enabled: false
  claimName: reporter-data
  size: 1Gi
  mountPath: /app/output

imagePullSecrets: []
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
