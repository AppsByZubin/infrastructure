env:
  TZ: Asia/Kolkata
  NATS_URL: ""
  NATS_CONNECT_RETRY_MAX: "0"
  NATS_CONNECT_RETRY_WAIT_SEC: "2"
  NATS_CONNECT_TIMEOUT_SEC: "5"

  APP_MODE: mock
  APP_TIMEZONE: Asia/Kolkata
  ACCOUNT_INITIAL_CASH: "0"

  UPSTOX_API_BASE_URL: https://api.upstox.com
  UPSTOX_API_VERSION: "2.0"
  UPSTOX_ORDER_PLACE_PATH: /v3/order/place
  UPSTOX_ORDER_MODIFY_PATH: /v3/order/modify
  UPSTOX_ORDER_DETAILS_PATH: /v2/order/details
  UPSTOX_ORDER_TRADES_PATH: /v2/order/trades
  UPSTOX_BROKERAGE_PATH: /v2/charges/brokerage
  UPSTOX_INSTRUMENT_KEY: "NSE_INDEX|Nifty 50"
  UPSTOX_MODE: ltpc

  ORDERSYSTEM_HTTP_ADDR: :8081
  ORDERSYSTEM_REQUEST_TIMEOUT: 15s
  ORDERSYSTEM_SL_POLL_INTERVAL: 10s
  ORDERSYSTEM_SL_REFRESH_MIN_INTERVAL: 10s
  ORDERSYSTEM_UPSTOX_ORDER_REQUEST_GAP: 750ms
  ORDERSYSTEM_UPSTOX_STATUS_REQUEST_GAP: 750ms
  ORDERSYSTEM_UPSTOX_STATUS_CACHE_TTL: 5s

  ORDERSYSTEM_BASE_URL: ""
  ORDER_SYSTEM_BASE_URL: ""
  OMS_BASE_URL: ""
  ORDERSYSTEM_TIMEOUT_SEC: "15"
  ORDER_SYSTEM_TIMEOUT_SEC: "15"
  OMS_TIMEOUT_SEC: "15"
  ORDERSYSTEM_ORDERS_CSV: ""
  ORDER_SYSTEM_ORDERS_CSV: ""
  OMS_ORDERS_CSV: ""

  SOLOBOT_MODE: mock
  SOLOBOT_BOT_NAME: solobot
  SOLOBOT_CURR_DATE: ""
  SOLOBOT_MONTH_YEAR: ""
  SOLOBOT_PARAM_YAML: |-
    strategy-parameters:
      trade-per-day: 3
      max-open-trades: 1

      # PERCENT values as fractions
      take-profit: 0.5     # +50%
      stop-loss: 0.113       # -10%
      max_daily_loss_pct_of_initial_cash: 0.02  # Stop new trades for the day after 2% realized loss

      min_atr_14: 10

      trailing-stop: true
      trailing-stop-distance: 10  # SL trails by 10 points once trailing starts
      trail-start-after-points: 0.1 # start trailing only after +5 points move

      break-even-point: 3

      sl-limit-gap: 1.0
      # 100 points at NIFTY 23335 ~= 0.42854%
      orb_gap_side_override_threshold_pct: 0.4285

      itm_strike_range: 400

      trade_expiry: "2026-04-14"
      pcr_expiry: "2026-04-07"
      pcr_poll_interval_sec: 120

      max_atr_for_contract: 20
      min_atr_for_contract: 13

      trade_within_day_open_limits: False
      ltp_open_max_distance_points: 210

      lot-size:
        small: 6
        medium: 8
        large: 10

      trade-window:
        start: "09:45"
        end: "15:00"

    historical-trends: &historical_trends
      weekly: "super_bearish"
      daily: "super_bearish"
      trader-sentiment: "super_bearish"

    # Backward-compatible alias
    historical-trend: *historical_trends
  SOLOBOT_PARAMS_YAML: ""
  SOLOBOT_PARAM_DATA: ""
  SOLOBOT_PARAMS: ""
  PARAM_YAML: ""
  PARAM_DATA: ""
  SOLOBOT_PARAM_FILE: ""
  SOLOBOT_PARAM_PATH: ""
  PARAM_FILE: ""
  PARAM_PATH: ""

  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"
  PIP_NO_CACHE_DIR: "1"
  PYTHONPATH: /app/bots/solobot

nats:
  enabled: true
  nameOverride: ""
  replicas: 1
  image:
    repository: nats
    tag: 2.10-alpine
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    clientPort: 4222
    monitoringPort: 8222
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

imagePullSecrets:
  - name: dockerhub-creds

ordersystem:
  enabled: true
  replicas: 1
  image:
    repository: "docker.io/bizzkpm/botsquadimage"
    tag: "ordersystem-76277fc"
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

marketfeeder:
  enabled: true
  replicas: 1
  image:
    repository: "docker.io/bizzkpm/botsquadimage"
    tag: "marketfeeder-76277fc"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

solobot:
  enabled: true
  image:
    repository: "docker.io/bizzkpm/botsquadimage"
    tag: "solobot-76277fc"
  backoffLimit: 0
  restartPolicy: OnFailure
  ttlSecondsAfterFinished:
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
  args:
  - --instruments
  - nifty50
  - --strategy
  - pcr_vwap_ema_orb
  - --level
  - mock
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
