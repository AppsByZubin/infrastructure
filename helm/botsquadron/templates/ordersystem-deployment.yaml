{{- if .Values.ordersystem.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "botsquadron.fullname" . }}-ordersystem
  namespace: {{ .Release.Namespace }}
  labels:
    app: ordersystem
    app.kubernetes.io/name: ordersystem
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: botsquadron
spec:
  replicas: {{ .Values.ordersystem.replicas }}
  selector:
    matchLabels:
      app: ordersystem
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: ordersystem
        app.kubernetes.io/name: ordersystem
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: botsquadron
    spec:
      containers:
        - name: ordersystem
          image: "{{ include "botsquadron.image" (dict "root" . "service" "ordersystem" "image" .Values.ordersystem.image) }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ordersystem.service.port }}
          envFrom:
            - configMapRef:
                name: {{ include "botsquadron.configMapName" . }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
{{ toYaml .Values.ordersystem.resources | indent 12 }}
{{- end }}
