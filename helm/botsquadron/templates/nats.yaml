{{- if .Values.nats.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "botsquadron.natsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: nats
    app.kubernetes.io/name: nats
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: botsquadron
spec:
  type: {{ .Values.nats.service.type }}
  selector:
    app: nats
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: client
      port: {{ .Values.nats.service.clientPort }}
      targetPort: client
    - name: monitoring
      port: {{ .Values.nats.service.monitoringPort }}
      targetPort: monitoring
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "botsquadron.natsName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app: nats
    app.kubernetes.io/name: nats
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: botsquadron
spec:
  replicas: {{ .Values.nats.replicas }}
  selector:
    matchLabels:
      app: nats
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: nats
        app.kubernetes.io/name: nats
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: botsquadron
    spec:
      containers:
        - name: nats
          image: "{{ .Values.nats.image.repository }}:{{ .Values.nats.image.tag }}"
          imagePullPolicy: {{ .Values.nats.image.pullPolicy }}
          args:
            - --http_port
            - "{{ .Values.nats.service.monitoringPort }}"
          ports:
            - name: client
              containerPort: {{ .Values.nats.service.clientPort }}
            - name: monitoring
              containerPort: {{ .Values.nats.service.monitoringPort }}
          readinessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: client
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
{{ toYaml .Values.nats.resources | indent 12 }}
{{- end }}
