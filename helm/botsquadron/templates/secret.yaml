{{- if and .Values.secret .Values.secret.enabled .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "botsquadron.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ include "botsquadron.fullname" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: botsquadron
type: Opaque
stringData:
  {{- $env := .Values.env | default dict }}
  {{- range $key, $value := .Values.secretEnv }}
  {{- $resolved := $value }}
  {{- if empty $resolved }}
  {{- $resolved = default "" (index $env $key) }}
  {{- end }}
  {{- if and (empty $resolved) (eq $key "upstox_api_access_token") }}
  {{- $resolved = default "" (index $env "UPSTOX_API_ACCESS_TOKEN") }}
  {{- end }}
  {{ $key }}: {{ default "" $resolved | toString | quote }}
  {{- end }}
{{- end }}
