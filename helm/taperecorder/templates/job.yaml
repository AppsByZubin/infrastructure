apiVersion: batch/v1
kind: Job
metadata:
  name: taperecorder
  namespace: {{ .Release.Namespace }}
  labels:
    app: taperecorder
  annotations:
    # Scope replacement to taperecorder's chart version. Repository commits for
    # other applications must not rerun this Job.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    appsbyzubin.com/restart-revision: {{ .Chart.Version | quote }}
spec:
  backoffLimit: 0
  # Optional: Delete the job 24 hours after completion
  # ttlSecondsAfterFinished: 86400

  template:
    metadata:
      labels:
        app: taperecorder
    spec:
      # Keep failed Job pods around so logs remain available after a quick crash.
      restartPolicy: Never

      containers:
        - name: taperecorder
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: "{{ $v }}"
            {{- end }}

          volumeMounts:
            - name: data
              mountPath: /app/data

          resources:
{{ toYaml .Values.resources | indent 12 }}

      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: taperecorder-data
