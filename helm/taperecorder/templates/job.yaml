apiVersion: batch/v1
kind: Job
metadata:
  name: taperecorder
  labels:
    app: taperecorder
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  # Optional: Delete the job 24 hours after completion
  # ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: taperecorder
    spec:
      containers:
      - name: taperecorder
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}

        env:
        {{- range $k, $v := .Values.env }}
        - name: {{ $k }}
          value: "{{ $v }}"
        {{- end }}

        envFrom:
        - secretRef:
            name: taperecorder-secrets

        volumeMounts:
        - name: data
          mountPath: /app/data

        resources:
{{ toYaml .Values.resources | indent 10 }}

      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: taperecorder-data

      restartPolicy: OnFailure