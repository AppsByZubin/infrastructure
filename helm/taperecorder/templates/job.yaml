apiVersion: batch/v1                       # CHANGED: Was apps/v1
kind: Job                                  # CHANGED: Was Deployment
metadata:
  name: taperecorder
  labels:                                  # Added labels for good practice
    app: taperecorder
  annotations:
    # Tells ArgoCD: "If this changes, delete the old one and create a new one"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  # Optional: Delete the job 24 hours after completion to clean up
  # ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: taperecorder
    spec:
      containers:
      - name: taperecorder
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}

        env:
        {{- range $k, $v := .Values.env }}
        - name: {{ $k }}
          value: "{{ $v }}"
        {{- end }}

        envFrom:
        - secretRef:
            name: taperecorder-secrets

        volumeMounts:
        - name: data
          mountPath: /app/data

        resources:
{{ toYaml .Values.resources | indent 10 }}

      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: taperecorder-data

      # NEW: Required for Jobs. Stops the loop when the script finishes.
      restartPolicy: OnFailure