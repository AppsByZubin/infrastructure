apiVersion: batch/v1
kind: Job
metadata:
  name: taperecorder
  namespace: {{ .Release.Namespace }}
  labels:
    app: taperecorder
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 0
  # Optional: Delete the job 24 hours after completion
  # ttlSecondsAfterFinished: 86400

  template:
    metadata:
      labels:
        app: taperecorder
    spec:
      restartPolicy: OnFailure

      containers:
        - name: taperecorder
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | toString | quote }}
            {{- end }}

          {{- if and .Values.secret .Values.secret.enabled }}
          envFrom:
            - secretRef:
                name: {{ .Values.secret.name | default "taperecorder-secrets" }}
          {{- end }}

          {{- if and .Values.pvc .Values.pvc.enabled }}
          volumeMounts:
            - name: data
              mountPath: /app/data
          {{- end }}

          resources:
{{ toYaml .Values.resources | indent 12 }}

      {{- if and .Values.pvc .Values.pvc.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: taperecorder-data
      {{- end }}
