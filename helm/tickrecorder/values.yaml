image:
  repository: docker.io/bizzkpm/tickrecorder
  tag: "latest"
  pullPolicy: Always

# ArgoCD should set this to $ARGOCD_APP_REVISION so a new rendered revision
# replaces and reruns the one-shot Job, matching taperecorder.
restartRevision: ""

# Must cover socket shutdown, Parquet drain, gzip creation, Spaces upload,
# and full read-back checksum verification before Kubernetes sends SIGKILL.
terminationGracePeriodSeconds: 1800

env:
  TZ: Asia/Kolkata

  # Required exact FYERS symbols. Override this before deploying.
  FYERS_SYMBOLS: ""
  FYERS_APP_ID: ""
  FYERS_ACCESS_TOKEN: ""
  FYERS_TBT_CHANNEL: "1"

  TICKRECORDER_DATA_DIR: /app/data
  TICKRECORDER_LOG_DIR: /app/data/logs
  TICKRECORDER_SDK_LOG_DIR: /app/data/logs/fyers-sdk
  TICKRECORDER_LOG_LEVEL: INFO
  TICKRECORDER_TIMEZONE: Asia/Kolkata
  TICKRECORDER_PARQUET_COMPRESSION: zstd

  DO_S3_ENDPOINT_URL: "https://sgp1.digitaloceanspaces.com"
  DO_S3_REGION: "sgp1"
  DO_S3_BUCKET_NAME: "index-bucket"
  DO_S3_SPACES_PREFIX: "index-bucket-holder/contracts"
  DO_S3_ACCESS_KEY_ID: ""
  DO_S3_SECRET_ACCESS_KEY: ""

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "2"
    memory: "3Gi"

pvc:
  enabled: true
  claimName: tickrecorder-data
  size: 20Gi
  accessMode: ReadWriteOncePod
