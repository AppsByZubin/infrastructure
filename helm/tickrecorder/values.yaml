image:
  repository: docker.io/bizzkpm/tickrecorder
  tag: "sha-aa4f225"
  pullPolicy: Always

# Leave empty for the public Docker Hub repository. The production deployment
# script sets this when DOCKERHUB_USERNAME and DOCKERHUB_TOKEN are provided.
imagePullSecrets: []

# Must cover socket shutdown, Parquet drain, gzip creation, CloudPe S3 upload,
# and full read-back checksum verification before Kubernetes sends SIGKILL.
terminationGracePeriodSeconds: 1800

env:
  TZ: Asia/Kolkata

  # Required exact FYERS symbols. Override this before deploying.
  FYERS_SYMBOLS: 'NSE:SBIN-EQ,NSE:RELIANCE-EQ,NSE:BHARTIARTL-EQ,NSE:HDFCBANK-EQ,NSE:TMCV-EQ,NSE:TMPV-EQ,NSE:AXISBANK-EQ,NSE:ADANIPOWER-EQ,NSE:KOTAKBANK-EQ,NSE:BAJFINANCE-EQ'
  FYERS_APP_ID: "312LB7M2BK-100"
  FYERS_ACCESS_TOKEN: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..FW47AcuL_8wqCtsRwXLtdVSbqG7P3qjklrRRcTLT5e8"
  FYERS_TBT_CHANNEL: "1"

  TICKRECORDER_DATA_DIR: /app/data
  TICKRECORDER_LOG_DIR: /app/data/logs
  TICKRECORDER_SDK_LOG_DIR: /app/data/logs/fyers-sdk
  TICKRECORDER_LOG_LEVEL: INFO
  TICKRECORDER_TIMEZONE: Asia/Kolkata
  # Zero selects the application's weekday 09:15-15:31 IST market window.
  TICKRECORDER_DURATION_SECONDS: "0"
  TICKRECORDER_PARQUET_COMPRESSION: zstd

  TICKRECORDER_S3_UPLOAD_ENABLED: "true"

  CLOUDPE_S3_ENDPOINT_URL: https://s3.in-west2.purestore.io
  CLOUDPE_S3_REGION: in-west2
  CLOUDPE_S3_BUCKET_NAME: index-bucket
  CLOUDPE_S3_PREFIX: index-bucket-holder/contracts
  CLOUDPE_S3_SECRET_ACCESS_KEY: R8VUoxQ0FTrfDPETEG2SXT06zGL7Jzew4RsG5KkA
  CLOUDPE_S3_ACCESS_KEY_ID: f5c29933a66353f4CT6L

resources:
  requests:
    cpu: "100m"
    memory: "512Mi"
  limits:
    cpu: "2"
    memory: "3Gi"

pvc:
  enabled: true
  claimName: tickrecorder-data
  size: 20Gi
  accessMode: ReadWriteOnce
