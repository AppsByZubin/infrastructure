apiVersion: batch/v1
kind: Job
metadata:
  name: tickrecorder
  namespace: {{ .Release.Namespace }}
  labels:
    app: tickrecorder
  annotations:
    # Match taperecorder: a sync replaces the one-shot Job. Trading-session
    # timing remains inside tickrecorder rather than Kubernetes.
    argocd.argoproj.io/sync-options: Force=true,Replace=true
    appsbyzubin.com/restart-revision: {{ .Values.restartRevision | default .Chart.Version | quote }}
spec:
  backoffLimit: 0

  template:
    metadata:
      labels:
        app: tickrecorder
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}

      containers:
        - name: tickrecorder
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          env:
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              {{- if has $name (list "FYERS_SYMBOLS" "FYERS_APP_ID" "FYERS_ACCESS_TOKEN" "DO_S3_ACCESS_KEY_ID" "DO_S3_SECRET_ACCESS_KEY") }}
              value: {{ required (printf "env.%s is required" $name) $value | quote }}
              {{- else }}
              value: {{ $value | quote }}
              {{- end }}
            {{- end }}

          {{- if .Values.pvc.enabled }}
          volumeMounts:
            - name: data
              mountPath: /app/data
          {{- end }}

          resources:
{{ toYaml .Values.resources | indent 12 }}

      {{- if .Values.pvc.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.pvc.claimName }}
      {{- end }}
